name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: tappy-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Protect preview from indexing
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/index.html")
          html = p.read_text(encoding="utf-8")
          meta = '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />'
          if meta not in html:
              html = html.replace("</head>", f"  {meta}\n</head>", 1)
          p.write_text(html, encoding="utf-8")
          PY
          cat >> dist/.htaccess <<'EOF'

          <IfModule mod_headers.c>
            Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"
          </IfModule>
          EOF

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COMBELL_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tappy_deploy
          chmod 600 ~/.ssh/tappy_deploy
          ssh-keyscan -H ssh.tappy.be >> ~/.ssh/known_hosts

      - name: Verify preview target
        run: |
          ssh -i ~/.ssh/tappy_deploy tappybe@ssh.tappy.be 'test -d /data/sites/web/tappybe/subsites/preview.tappy.be && test -w /data/sites/web/tappybe/subsites/preview.tappy.be'

      - name: Deploy preview
        run: |
          rsync -az --delete --exclude='.well-known/'             -e "ssh -i ~/.ssh/tappy_deploy"             dist/ tappybe@ssh.tappy.be:/data/sites/web/tappybe/subsites/preview.tappy.be/

      - name: Preview health check
        run: curl -L --fail --retry 5 --retry-delay 3 https://preview.tappy.be/
