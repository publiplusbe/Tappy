name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: tappy-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COMBELL_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tappy_deploy
          chmod 600 ~/.ssh/tappy_deploy
          ssh-keyscan -H ssh.tappy.be >> ~/.ssh/known_hosts

      - name: Verify preview target
        run: |
          ssh -i ~/.ssh/tappy_deploy tappybe@ssh.tappy.be 'test -d /data/sites/web/tappybe/subsites/preview && test -w /data/sites/web/tappybe/subsites/preview'

      - name: Deploy preview
        run: |
          rsync -az --delete --exclude='.well-known/'             -e "ssh -i ~/.ssh/tappy_deploy"             dist/ tappybe@ssh.tappy.be:/data/sites/web/tappybe/subsites/preview/

      - name: Preview health check
        run: curl -L --fail --retry 5 --retry-delay 3 https://preview.tappy.be/
